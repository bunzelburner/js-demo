<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="demo1.js" defer></script>
    <script src="demo2.js" defer></script>
    <script src="demo3.js" defer></script>
    <script src="main.js" defer></script>
    <title>Javascript Demo</title>
  </head>
  <body>
    <div class="nav-buttons">
      <button id="demo1-button" style="background-color: blue; color: white" onclick="navigateTo('demo1')">Demo 1</button>
      <button id="demo2-button" style="background-color: white; color: black" onclick="navigateTo('demo2')">Demo 2</button>
      <button id="demo3-button" style="background-color: white; color: black" onclick="navigateTo('demo3')">Demo 3</button>
      <button id="demo4-button" style="background-color: white; color: black" onclick="navigateTo('demo4')">Demo 4</button>
      <button onclick="toggleFullscreen()">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">

            id="exit-fullscreen"

    </div>
    <div class="demo1">
      <div style="display: flex; gap: 20px">
        <div class="demo1-controls-container">
          <button onclick="movePicture('up')">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
              <path
                d="M229.66,114.34l-96-96a8,8,0,0,0-11.32,0l-96,96A8,8,0,0,0,32,128H72v80a16,16,0,0,0,16,16h80a16,16,0,0,0,16-16V128h40a8,8,0,0,0,5.66-13.66ZM176,112a8,8,0,0,0-8,8v88H88V120a8,8,0,0,0-8-8H51.31L128,35.31,204.69,112Z"
              ></path>
            </svg>
          </button>
          <div style="display: flex; gap: 5px">
            <button onclick="movePicture('left')">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                <path
                  d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"
                ></path>
              </svg>
            </button>
            <button onclick="movePicture('right')">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                <path
                  d="M237.66,122.34l-96-96A8,8,0,0,0,128,32V72H48A16,16,0,0,0,32,88v80a16,16,0,0,0,16,16h80v40a8,8,0,0,0,13.66,5.66l96-96A8,8,0,0,0,237.66,122.34ZM144,204.69V176a8,8,0,0,0-8-8H48V88h88a8,8,0,0,0,8-8V51.31L220.69,128Z"
                ></path>
              </svg>
            </button>
          </div>
          <button onclick="movePicture('down')">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
              <path
                d="M231.39,132.94A8,8,0,0,0,224,128H184V48a16,16,0,0,0-16-16H88A16,16,0,0,0,72,48v80H32a8,8,0,0,0-5.66,13.66l96,96a8,8,0,0,0,11.32,0l96-96A8,8,0,0,0,231.39,132.94ZM128,220.69,51.31,144H80a8,8,0,0,0,8-8V48h80v88a8,8,0,0,0,8,8h28.69Z"
              ></path>
            </svg>
          </button>
        </div>
        <div class="demo1-colors-container">
          <div style="text-align: center; width: 100px">Canvas Color</div>
          <button onclick="changeBackgroundColor('white')">White</button>
          <button onclick="changeBackgroundColor('red')">Red</button>
          <button onclick="changeBackgroundColor('orange')">Orange</button>
          <button onclick="changeBackgroundColor('yellow')">Yellow</button>
          <button onclick="changeBackgroundColor('black')">Black</button>
        </div>
        <div class="demo1-colors-container">
          <div style="text-align: center; width: 100px">Picture Opacity</div>
          <button onclick="changePictureOpacity(0)">0%</button>
          <button onclick="changePictureOpacity(25)">25%</button>
          <button onclick="changePictureOpacity(50)">50%</button>
          <button onclick="changePictureOpacity(75)">75%</button>
          <button onclick="changePictureOpacity(100)">100%</button>
        </div>
        <div class="demo1-colors-container">
          <div style="text-align: center; width: 100px">Picture Display</div>
          <button onclick="changePictureDisplay('none')">None</button>
          <button onclick="changePictureDisplay('block')">Block</button>
        </div>
        <div class="demo1-stats-container">
          <div class="demo1-stats-line">
            <div class="demo1-stats-label">Left:</div>
            <div id="picture-left"></div>
          </div>
          <div class="demo1-stats-line">
            <div class="demo1-stats-label">Top:</div>
            <div id="picture-top"></div>
          </div>
          <div class="demo1-stats-line">
            <div class="demo1-stats-label">Right:</div>
            <div id="picture-right"></div>
          </div>
          <div class="demo1-stats-line">
            <div class="demo1-stats-label">Bottom:</div>
            <div id="picture-bottom"></div>
          </div>
        </div>
      </div>
      <div class="demo1-picture-container">
        <img id="picture1" src="https://content.mrbunz.com/picture.webp" class="picture" />
      </div>
    </div>
    <div class="demo2">
      <marquee id="marquee" scrollamount="30" direction="right" style="width: 1px; font-size: 50px">This is a marq-weeeeeeee!</marquee>
      <div style="display: flex; gap: 10px">
        <button onclick="blockingCountDown()">Blocking Countdown</button>
        <button onclick="nonBlockingCountdown()">Non-Blocking Countdown</button>
        <div class="countdown-timer">
          <div>Time Left:</div>
          <div id="countdown-timer-value" style="margin-left: auto">15</div>
        </div>
      </div>
    </div>
    <div class="demo3">
      <div style="display: flex; flex-direction: column; gap: 10px; width: 205px">
        <div style="text-align: center; font-size: 20px">To Do List:</div>
        <div id="list" style="padding: 10px; border: 1px solid black; border-radius: 10px"></div>
        <div style="display: flex; gap: 5px">
          <input id="new-item" style="width: 150px" />
          <button style="width: 50px" onclick="addItem()">Add</button>
        </div>
        <button onclick="clearList()">Clear list</button>
      </div>
    </div>
    <div class="demo4">
      <div class="menu">
        <button>Menu</button>
        <div class="menu-list">
          <div class="menu-item"><a href="https://google.com" target="_blank">Google</a></div>
          <div class="menu-item"><a href="https://amazon.com" target="_blank">Amazon</a></div>
          <div class="menu-item"><a href="https://cvsd.org" target="_blank">CVSD</a></div>
        </div>
      </div>
      <div style="margin-top: 5px">Some other stuff down here</div>
      <div>and some other stuff down here</div>
      <div>and some other stuff down here</div>
      <div>and some other stuff down here</div>
      <div>and some other stuff down here</div>
    </div>
  </body>
</html>
